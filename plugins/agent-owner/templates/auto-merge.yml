# auto-merge ロボット — Layer 0（開発の責任）の権限側
#
# LLM に gh pr merge を許す代わりに、このワークフローが条件を機械判定してマージする:
#   1. agent-review:passed ラベル（レビューループ通過）
#   2. required checks が green
#   3. 聖域パスに触れていない（触れる PR は human-merge を付与して人間へ）
#
# 聖域 = 金・DB・PayWall・法務・そして「憲法とこのマージ条件自体」。
# エージェントが自分のルールを書き換えて main に入れる経路を封鎖するのが最重要の役割。
#
# 前提（人間セットアップ）:
#   - secrets.AUTOMERGE_PAT: PAT（contents: RW / pull-requests: RW）。
#     GITHUB_TOKEN でマージすると push イベントが deploy-staging を起動しないため PAT 必須。
#   - branch protection は GitHub Free の private リポジトリでは使えない場合がある。
#     使えない環境では CI green の判定は本ワークフローが必須チェックの名前指定で自前検証する。
#
# 参照実装: genetta-inc/suimei（PR #41, #47, #51, #53, #54）。
name: Auto Merge

on:
  pull_request:
    types: [labeled]
  schedule:
    # ラベル付与後に CI が通った PR の取りこぼし救済（レビューループは毎時なので 30 分で十分）
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  # gh pr checks（GraphQL statusCheckRollup）に必要
  checks: read
  statuses: read

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  merge-eligible:
    runs-on: ubuntu-latest
    steps:
      - name: Merge eligible PRs
        env:
          # 参照系・ラベル・コメントは GITHUB_TOKEN。マージだけ PAT
          # （GITHUB_TOKEN のマージでは push イベントが deploy-staging を起動しないため）
          GH_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ secrets.AUTOMERGE_PAT }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$MERGE_TOKEN" ]; then
            echo "::warning::AUTOMERGE_PAT が未設定のため何もしません"
            exit 0
          fi

          # 聖域パス（変更するには本ファイル自体の human-merge が必要 = 自己参照的に保護される）
          # プロジェクトに合わせて調整: DB マイグレーション・課金/価格ロジック・決済導線・法務ページ・
          # ワークフロー自体・憲法ファイル・.claude 設定など「金・DB・法務・自己言及コア」を列挙する
          SACRED='^(supabase/migrations/|lib/pricing\.ts$|app/checkout/|proxy\.ts$|app/legal/|\.github/workflows/|docs/agent-loop\.md$|docs/agent-audit\.md$|CLAUDE\.md$|\.claude/)'

          # gh pr list --label はコロン入りラベル名で0件を返すことがあるため REST で列挙する
          for N in $(gh api "repos/$REPO/pulls?state=open&per_page=100" \
                       --jq '.[] | select(.draft | not) | select([.labels[].name] | index("agent-review:passed")) | .number'); do
            echo "--- PR #$N ---"

            if gh pr view "$N" --repo "$REPO" --json labels --jq '.labels[].name' | grep -qx "human-merge"; then
              echo "human-merge 付与済み: スキップ"
              continue
            fi

            TOUCHED=$(gh pr diff "$N" --repo "$REPO" --name-only | grep -E "$SACRED" || true)
            if [ -n "$TOUCHED" ]; then
              gh api "repos/$REPO/issues/$N/labels" -f "labels[]=human-merge" >/dev/null
              gh pr comment "$N" --repo "$REPO" --body "🔒 **auto-merge 対象外**: 聖域パスに変更が含まれるため、人間のマージ判断が必要です（\`human-merge\` を付与）。対象: ${TOUCHED//$'\n'/, }"
              echo "聖域パス接触: human-merge を付与"
              continue
            fi

            # branch protection が使えない環境向けに、必須チェックを名前指定で自前検証する。
            # gh pr checks（GraphQL）は checkSuite.workflowRun が actions: read を要求するなど
            # 隠れ権限が多いため、checks: read だけで完結する REST で判定する。
            #
            # group_by(.name) | map(max_by(.started_at)) で check 名ごとに最新の check run だけを
            # 見る（draft→ready で同一 SHA に skipped/success の check suite が併存する既知バグの
            # 恒久修正。suimei では PR #54 として提案・適用済み）。
            HEAD_SHA=$(gh api "repos/$REPO/pulls/$N" --jq '.head.sha' || echo "")
            REQUIRED_OK=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "Actionlint" or .name == "Lint & Type Check & Test")] | group_by(.name) | map(max_by(.started_at)) | (length >= 2) and all(.conclusion == "success")' \
              || echo "false")
            if [ "$REQUIRED_OK" != "true" ]; then
              echo "必須チェック（Actionlint / Lint & Type Check & Test）が green でない: 次回スケジュールで再判定"
              continue
            fi

            if GH_TOKEN="$MERGE_TOKEN" gh pr merge "$N" --repo "$REPO" --squash; then
              gh pr comment "$N" --repo "$REPO" --body "🤖 **auto-merged** — 根拠: agent-review:passed / 必須チェック（Actionlint, Lint & Type Check & Test）green / 聖域パス非接触。判定ログ: $RUN_URL（マージ後は staging デプロイ → スモークテスト → 失敗時は自動 revert）"
              echo "マージ完了"
            else
              echo "::warning::PR #$N のマージに失敗（コンフリクト等）。レビューループの鮮度チェックに任せる"
            fi
          done
